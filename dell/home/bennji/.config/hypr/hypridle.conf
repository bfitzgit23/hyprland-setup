general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim screen to 15% after 3 minutes (180s) of idle
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# 2. Lock screen after 5 minutes (300s) of idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off display (DPMS off) after 6 minutes (360s) of idle
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend after 10 minutes (600s) ONLY when running on battery
listener {
    timeout = 600
    on-timeout = grep -q 1 /sys/class/power_supply/*/online 2>/dev/null || loginctl suspend
}
