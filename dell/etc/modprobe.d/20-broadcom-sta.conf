# BCM4352 (Dell DW1560, 14e4:43b1) is driven by broadcom-sta (wl).
# bcma-pci-bridge claims the PCI function before wl can, and b43 cannot drive
# this chip (it probes and fails with -95), which leaves the card with no
# interface at all. Keep the old stack away so wl binds the device.
blacklist bcma
blacklist b43
blacklist ssb
blacklist brcmsmac
blacklist brcmfmac
blacklist brcmutil

# The blacklist alone is not enough: bcma-pci-bridge still loaded at boot and
# bound 0000:70:00.0 before wl (dmesg: "bcma-pci-bridge ... Found chip with id
# 0x4352" at 8.95s, wl at 9.20s). Handing the radio to bcma and then pulling it
# back leaves the card half-initialised, which shows up later as link stalls.
# `install` intercepts any modprobe of these names, including dependency pulls,
# so bcma never touches the device; nothing else on this machine uses it.
install bcma /bin/true
install ssb /bin/true
install b43 /bin/true
install brcmsmac /bin/true
