# modprobe.d configuration file for WL

# Internal Aliases - Do not edit
# ------------------------------
alias wlan0 wl


# Configurable module parameters
# ------------------------------
# passivemode:	 (int)
# wl_txq_thresh:	 (int)
# oneonly:	 (int)
# piomode:	 (int)
# instance_base:	 (int)
# nompc:	 (int)
# intf_name:	 (string)

# Disable MPC (minimal power consumption): with it enabled the radio idles
# aggressively between packets, which on this BCM4352 shows up as multi-second
# stalls that look like the network going away. NetworkManager already sets
# wifi.powersave=2; this covers the driver level as well. Takes effect on the
# next wl module load (reboot), not on a live reload.
options wl nompc=1

