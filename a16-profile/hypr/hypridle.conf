# hypridle (Hyprland 0.57 still reads this file from ~/.config/hypr/).
#
# Suspend only when the machine is genuinely idle and not on a dying battery:
# a low-battery suspend in the middle of builds is what repeatedly took the
# desktop off the network, so the last listener is disabled by default.

general {
    lock_cmd = loginctl lock-session
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the panel after 5 minutes.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock after 15 minutes.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Suspend after 30 minutes - commented out on purpose; enable it if you want
# the laptop to sleep by itself.
