# OPTIONAL — only needed if you run RustDesk's GUI without the root service.
#
# RustDesk branches on whether the root service is running
# (src/server/wayland.rs):
#
#   user GUI, no service  ->  RemoteDesktop.CreateSession  (needs this file)
#   rustdesk --service    ->  ScreenCast.CreateSession + uinput  (stock is fine)
#
# With `rc-service rustdesk start` in the default runlevel — the setup this
# profile uses — ScreenCast from xdg-desktop-portal-hyprland is enough and
# /dev/uinput is opened by the root service. Installing luminous and routing
# portals is then unnecessary.
#
# If you do want the user-mode path: build luminous
# (https://github.com/waycrate/xdg-desktop-portal-luminous, cargo build
# --release, ~3.5 min), install it to /usr/libexec/, add the D-Bus service
# file org.freedesktop.impl.portal.desktop.luminous.service, then copy this
# file to ~/.config/xdg-desktop-portal/hyprland-portals.conf.
#
# Keys must be the impl interface names. A bare `RemoteDesktop=luminous` line
# is silently ignored and exports no interface at all — that mistake costs an
# afternoon in the portal debug log (`G_MESSAGES_DEBUG=all`).
#
# ScreenCast has to move too: a RemoteDesktop session dispatches SelectSources
# to the global ScreenCast implementation, so routing only RemoteDesktop gives
# a session that never starts. Discord/OBS sharing then also goes through
# luminous — re-check them afterwards.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.RemoteDesktop=luminous;hyprland;gtk
org.freedesktop.impl.portal.ScreenCast=luminous;hyprland;gtk
